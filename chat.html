<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat Rooms - DeeChat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    background:#eaf7ff;
    font-family:Arial,sans-serif;
    font-size:14px;
    color:#222;
}
a{color:#0645ad;text-decoration:none}
.header{
    background:#1683c7;
    color:white;
    padding:10px;
    font-size:20px;
    font-weight:bold;
}
.nav{
    background:#d8efff;
    padding:7px;
    line-height:25px;
    border-bottom:1px solid #9acbe8;
}
.box{
    margin:8px;
    border:1px solid #b5cddd;
    background:white;
}
.title{
    background:#ffd83d;
    padding:7px;
    font-weight:bold;
}
.content{padding:8px}
.room{
    border-bottom:1px solid #ddd;
    padding:8px 2px;
}
.room:last-child{border-bottom:0}
.room-link{
    font-weight:bold;
    color:#0645ad;
}
.room-desc{
    color:#666;
    font-size:12px;
    margin-top:3px;
}
.selected{
    background:#e8f6ff;
}
.message{
    border-bottom:1px solid #ddd;
    padding:8px 2px;
}
.message:last-child{border-bottom:0}
.username{font-weight:bold}
.meta{
    color:#777;
    font-size:11px;
}
.body{
    margin-top:4px;
    white-space:pre-wrap;
    line-height:1.4;
}
.role{
    display:inline-block;
    padding:1px 4px;
    font-size:10px;
    border:1px solid #ccc;
    margin-left:3px;
}
.owner{
    background:#ffd700;
    border-color:#c5a900;
}
.staff{
    background:#cceeff;
    color:#005580;
}
.verified{
    color:#008000;
}
.online{
    color:#008000;
    font-size:11px;
}
textarea{
    width:100%;
    box-sizing:border-box;
    min-height:65px;
    padding:7px;
    border:1px solid #aaa;
}
button{
    background:#1683c7;
    color:white;
    border:0;
    padding:7px 12px;
    margin-top:5px;
}
button:disabled{
    background:#999;
}
.notice{
    background:#fff8c7;
    border:1px solid #e5d36b;
    padding:7px;
    margin-bottom:7px;
}
.error{color:#b00000;padding:7px}
.success{color:#008000;padding:7px}
.small{font-size:12px;color:#777}
.footer{
    text-align:center;
    padding:15px 8px;
    color:#777;
    font-size:12px;
}
</style>
</head>

<body>

<div class="header">💬 DeeChat Chat</div>

<div class="nav">
<a href="homepage.html">Home</a> |
<a href="shouts.html">Shouts</a> |
<a href="topics.html">Topics</a> |
<a href="members.html">Members</a> |
<a href="groups.html">Groups</a>
</div>

<div id="message"></div>

<div class="box">
<div class="title">Chat Rooms</div>
<div class="content" id="rooms">
Loading rooms...
</div>
</div>

<div class="box">
<div class="title" id="roomTitle">Select a Room</div>

<div class="content">

<div id="announcement"></div>

<div id="messages">
Select a room to view messages.
</div>

</div>
</div>

<div class="box">

<div class="title">Send Message</div>

<div class="content">

<textarea
id="messageInput"
placeholder="Write a message..."
disabled
></textarea>

<br>

<button
id="sendBtn"
disabled
>
Send Message
</button>

</div>

</div>

<div class="footer">
© 2026 DeeChat
</div>


<script>

const SUPABASE_URL =
"https://sqikfejouaxizvidivcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser=null;
let currentRoom=null;
let rooms=[];


/* ESCAPE */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ROLE */

function roleTag(profile){

if(!profile) return "";

const role=profile.site_role;

if(role==="owner")
return `<span class="role owner">OWNER</span>`;

if(role==="super_admin")
return `<span class="role staff">SUPER ADMIN</span>`;

if(role==="admin")
return `<span class="role staff">ADMIN</span>`;

if(role==="head_mod")
return `<span class="role staff">HEAD MOD</span>`;

if(role==="moderator")
return `<span class="role staff">MOD</span>`;

if(role==="vip")
return `<span class="role staff">VIP</span>`;

if(role==="verified_member")
return `<span class="role staff">VERIFIED</span>`;

return "";

}


/* LOGIN */

async function checkLogin(){

const {data,error} =
await supabaseClient.auth.getSession();

if(error || !data.session){

window.location.href="login.html";

return false;

}

currentUser=data.session.user;

return true;

}


/* LOAD ROOMS */

async function loadRooms(){

const {data,error} =
await supabaseClient
.from("rooms")
.select(`
id,
name,
description,
visibility,
is_locked,
pinned_announcement,
created_at
`)
.order("created_at",{ascending:true});

if(error){

document.getElementById("rooms").innerHTML=
`<div class="error">
Could not load rooms.
</div>`;

console.error(error);

return;

}

rooms=data || [];

renderRooms();

}


/* RENDER ROOMS */

function renderRooms(){

const container=
document.getElementById("rooms");

if(!rooms.length){

container.innerHTML=
`<div class="small">
No chat rooms have been created yet.
</div>`;

return;

}

container.innerHTML=
rooms.map(room=>{

const active=
currentRoom &&
currentRoom.id===room.id
?"selected":"";

return `

<div class="room ${active}">

<a
href="#"
class="room-link"
onclick="selectRoom('${room.id}');return false;"
>
${room.is_locked?"🔒 ":""}💬
${escapeHTML(room.name)}
</a>

<div class="room-desc">
${escapeHTML(room.description || "No description")}
</div>

<div class="meta">
${escapeHTML(room.visibility || "public")}
</div>

</div>

`;

}).join("");

}


/* SELECT ROOM */

async function selectRoom(roomId){

const room=
rooms.find(r=>r.id===roomId);

if(!room) return;

currentRoom=room;

document.getElementById("roomTitle")
.innerText=
"💬 "+room.name;

document.getElementById("messageInput")
.disabled=room.is_locked;

document.getElementById("sendBtn")
.disabled=room.is_locked;

if(room.is_locked){

document.getElementById("messageInput")
.placeholder="This room is locked.";

}else{

document.getElementById("messageInput")
.placeholder=
"Write a message...";

}

renderRooms();

renderAnnouncement();

await loadMessages();

}


/* ANNOUNCEMENT */

function renderAnnouncement(){

const box=
document.getElementById("announcement");

if(!currentRoom ||
!currentRoom.pinned_announcement){

box.innerHTML="";

return;

}

box.innerHTML=
`<div class="notice">
📌 <b>Announcement:</b><br>
${escapeHTML(
currentRoom.pinned_announcement
)}
</div>`;

}


/* LOAD MESSAGES */

async function loadMessages(){

if(!currentRoom) return;

document.getElementById("messages")
.innerHTML="Loading messages...";


const {data,error} =
await supabaseClient
.from("messages")
.select(`
id,
body,
is_hidden,
is_pinned,
created_at,
user_id,
profiles:user_id(
username,
display_name,
site_role,
is_verified,
last_active_at
)
`)
.eq("room_id",currentRoom.id)
.eq("is_hidden",false)
.order("created_at",{ascending:true})
.limit(100);


if(error){

document.getElementById("messages")
.innerHTML=
`<div class="error">
Could not load messages.
</div>`;

console.error(error);

return;

}


if(!data || data.length===0){

document.getElementById("messages")
.innerHTML=
`<div class="small">
No messages yet. Start the conversation!
</div>`;

return;

}


document.getElementById("messages")
.innerHTML=
data.map(msg=>{

const profile=msg.profiles;

const verified=
profile?.is_verified
?`<span class="verified">✔</span>`
:"";

const pinned=
msg.is_pinned
?`<div class="small">📌 Pinned</div>`
:"";

return `

<div class="message">

<div class="username">

<a href="profile.html?id=${msg.user_id}">
${escapeHTML(
profile?.display_name ||
profile?.username ||
"Member"
)}
</a>

${roleTag(profile)}
${verified}

</div>

<div class="meta">
${new Date(msg.created_at).toLocaleString()}
</div>

${pinned}

<div class="body">
${escapeHTML(msg.body)}
</div>

</div>

`;

}).join("");


/* Scroll chat to bottom */

const box=
document.getElementById("messages");

box.scrollTop=box.scrollHeight;

}


/* SEND MESSAGE */

document.getElementById("sendBtn")
.addEventListener("click",sendMessage);


document.getElementById("messageInput")
.addEventListener("keydown",function(event){

if(event.key==="Enter" && !event.shiftKey){

event.preventDefault();

sendMessage();

}

});


async function sendMessage(){

if(!currentUser || !currentRoom)
return;

if(currentRoom.is_locked)
return;


const input=
document.getElementById("messageInput");

const body=
input.value.trim();

if(!body){

document.getElementById("message")
.innerHTML=
`<div class="error">
Write a message first.
</div>`;

return;

}


const button=
document.getElementById("sendBtn");

button.disabled=true;

button.innerText="Sending...";


const {error} =
await supabaseClient
.from("messages")
.insert({

room_id:currentRoom.id,

user_id:currentUser.id,

body:body

});


if(error){

document.getElementById("message")
.innerHTML=
`<div class="error">
${escapeHTML(error.message)}
</div>`;

button.disabled=false;

button.innerText="Send Message";

return;

}


input.value="";

document.getElementById("message")
.innerHTML=
`<div class="success">
Message sent.
</div>`;

button.disabled=false;

button.innerText="Send Message";

await loadMessages();

}


/* UPDATE LAST ACTIVE */

async function updateLastActive(){

if(!currentUser) return;

await supabaseClient
.from("profiles")
.update({
last_active_at:new Date().toISOString()
})
.eq("id",currentUser.id);

}


/* START */

(async function(){

const loggedIn=
await checkLogin();

if(!loggedIn) return;

await updateLastActive();

await loadRooms();

})();

</script>

</body>
</html>
