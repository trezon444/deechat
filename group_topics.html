<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeeChat - Group Topics</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;background:#f3f3e8;color:#222;font-family:Arial,sans-serif;font-size:14px}
a{color:#0645ad;text-decoration:none}
a:hover{text-decoration:underline}
.header{background:#174a8b;color:#fff;padding:8px;font-size:20px;font-weight:bold}
.nav{background:#fff3a6;border-bottom:1px solid #d5c85b;padding:6px;line-height:1.8}
.nav a{margin-right:8px}
.box{background:#fff;border:1px solid #ccc;margin:8px;padding:8px}
.title{background:#ffe45c;border:1px solid #d6c13b;padding:6px;font-weight:bold;margin-bottom:7px}
input,textarea,select{width:100%;box-sizing:border-box;padding:7px;border:1px solid #aaa;margin:3px 0 7px;font-family:Arial;font-size:14px}
textarea{min-height:80px}
button,.btn{display:inline-block;background:#174a8b;color:#fff;border:1px solid #0d315e;padding:6px 10px;margin:3px 2px;cursor:pointer}
button:hover,.btn:hover{background:#0d315e}
.topic{border-bottom:1px dotted #aaa;padding:8px 0}
.avatar{width:38px;height:38px;float:left;margin-right:7px;object-fit:cover;background:#ddd}
.clear{clear:both}
.role{color:#8a5200;font-size:11px;font-weight:bold}
.site-role{color:#174a8b;font-size:11px;font-weight:bold}
.small{color:#666;font-size:12px}
.error{color:#a00000;font-weight:bold}
.success{color:#087a21;font-weight:bold}
.notice{background:#fff8c7;border:1px solid #ddd083;padding:7px}
.footer{text-align:center;color:#666;padding:15px 5px;font-size:12px}
</style>
</head>

<body>

<div class="header">DeeChat - Group Topics</div>

<div class="nav">
<a href="homepage.html">Home</a>
<a href="groups.html">Groups</a>
<a id="groupLink" href="groups.html">Group</a>
<a href="topics.html">Topics</a>
<a href="members.html">Members</a>
</div>

<div id="messageBox"></div>

<div class="box">
<div class="title">Group</div>
<div id="groupInfo">Loading...</div>
</div>

<div class="box">
<div class="title">Create Group Topic</div>

<input id="topicTitle" maxlength="150" placeholder="Topic title">

<input id="topicCategory" maxlength="60" placeholder="Category">

<textarea id="topicBody" maxlength="5000" placeholder="Write your topic..."></textarea>

<button onclick="createTopic()">Post Topic</button>

</div>

<div class="box">
<div class="title">Latest Group Topics</div>
<div id="topics">Loading topics...</div>
</div>

<div class="footer">
© DeeChat 2026
</div>

<script>

const SUPABASE_URL="https://sqikfejouaxizvidivcg.supabase.co";
const SUPABASE_KEY="sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser=null;
let currentProfile=null;
let groupId=null;
let groupData=null;
let groupMembers=[];


/* HELPERS */

function esc(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function formatDate(date){
if(!date)return "";
return new Date(date).toLocaleString([],{
year:"numeric",
month:"short",
day:"numeric",
hour:"2-digit",
minute:"2-digit"
});
}

function roleTag(profile){

if(!profile)return "";

const roles={
owner:"OWNER",
super_admin:"SUPER ADMIN",
admin:"ADMIN",
head_mod:"HEAD MOD",
moderator:"MOD",
vip:"VIP",
verified_member:"VERIFIED",
member:"MEMBER",
new_member:"NEW MEMBER"
};

return `<span class="site-role">[${
esc(roles[profile.site_role]||
String(profile.site_role||"").toUpperCase())
}]</span>`;
}

function groupTag(member){

if(!member)return "";

if(member.group_tag)
return `<span class="role">[${esc(member.group_tag)}]</span>`;

if(member.is_co_leader)
return `<span class="role">[CO-LEADER]</span>`;

if(member.group_rank)
return `<span class="role">[${esc(member.group_rank)}]</span>`;

return "";
}

function showMessage(text,isError){

document.getElementById("messageBox").innerHTML=`
<div class="box">
<span class="${isError?"error":"success"}">
${esc(text)}
</span>
</div>`;

setTimeout(()=>{
document.getElementById("messageBox").innerHTML="";
},4000);
}

function getGroupId(){

const params=new URLSearchParams(
window.location.search
);

return params.get("id");
}


/* AUTH */

async function checkAuth(){

const {data,error}=
await supabaseClient.auth.getSession();

if(error||!data.session){
window.location.href="login.html";
return false;
}

currentUser=data.session.user;

const {data:profile}=
await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.single();

currentProfile=profile;

return true;
}


/* GROUP */

async function loadGroup(){

const {data,error}=
await supabaseClient
.from("groups")
.select("*")
.eq("id",groupId)
.single();

if(error||!data){

document.getElementById("groupInfo").innerHTML=
`<span class="error">Group not found.</span>`;

return false;
}

groupData=data;

document.getElementById("groupLink").href=
"group.html?id="+groupId;

document.getElementById("groupInfo").innerHTML=`

<b>${esc(groupData.name)}</b>

${
groupData.abbreviation
?" ["+esc(groupData.abbreviation)+"]"
:""
}

<br>

<span class="small">
${esc(groupData.description||"No description.")}
</span>

<br><br>

<a href="group.html?id=${groupId}">
View Group
</a>
`;

return true;
}


/* MEMBERS */

async function loadMembers(){

const {data,error}=
await supabaseClient
.from("group_members")
.select(`
user_id,
group_rank,
group_tag,
is_co_leader,
profiles(
id,
username,
display_name,
avatar_url,
site_role,
is_verified
)
`)
.eq("group_id",groupId);

if(error){
console.error(error);
groupMembers=[];
return;
}

groupMembers=data||[];
}

function isMember(){

return groupMembers.some(
m=>m.user_id===currentUser.id
);
}


/* TOPICS */

async function loadTopics(){

const container=
document.getElementById("topics");

container.innerHTML="Loading topics...";

/*
Requires topics.group_id.
*/

const {data,error}=
await supabaseClient
.from("topics")
.select(`
id,
user_id,
title,
body,
category,
likes_count,
replies_count,
views_count,
is_locked,
created_at,
profiles(
id,
username,
display_name,
avatar_url,
site_role,
is_verified
)
`)
.eq("group_id",groupId)
.order("created_at",{ascending:false})
.limit(50);

if(error){

console.error(error);

container.innerHTML=`
<div class="notice">
<span class="error">
Group topics are not ready yet.
</span>
<br><br>
<span class="small">
The topics table needs a group_id column
for group-specific topics.
</span>
</div>`;

return;
}

if(!data||!data.length){

container.innerHTML=`
<div class="small">
No group topics yet.
Be the first to start a discussion.
</div>`;

return;
}

let html="";

data.forEach(topic=>{

const profile=topic.profiles;

if(!profile)return;

const member=groupMembers.find(
m=>m.user_id===topic.user_id
);

html+=`

<div class="topic">

<a href="topic.html?id=${topic.id}">
<b>${esc(topic.title)}</b>
</a>

<br>

${
topic.category
?`<span class="small">
Category: ${esc(topic.category)}
</span><br>`
:""
}

<span class="small">
By
<a href="profile.html?id=${profile.id}">
${esc(profile.display_name||profile.username)}
</a>
${roleTag(profile)}
${groupTag(member)}
</span>

<br><br>

${esc(
(topic.body||"").substring(0,300)
).replace(/\n/g,"<br>")}

${
(topic.body||"").length>300
?"..."
:""
}

<br><br>

<span class="small">
♥ ${Number(topic.likes_count||0)}
&nbsp; · &nbsp;
Replies: ${Number(topic.replies_count||0)}
&nbsp; · &nbsp;
Views: ${Number(topic.views_count||0)}
</span>

<br>

<span class="small">
${formatDate(topic.created_at)}
${topic.is_locked?" · LOCKED":""}
</span>

</div>
`;
});

container.innerHTML=html;
}


/* CREATE TOPIC */

async function createTopic(){

if(!isMember()){

showMessage(
"You must be a member of this group to create a topic.",
true
);

return;
}

const title=
document.getElementById("topicTitle")
.value.trim();

const category=
document.getElementById("topicCategory")
.value.trim();

const body=
document.getElementById("topicBody")
.value.trim();

if(!title){

showMessage(
"Enter a topic title.",
true
);

return;
}

if(!body){

showMessage(
"Write something in your topic.",
true
);

return;
}

const {error}=
await supabaseClient
.from("topics")
.insert({

user_id:currentUser.id,

title:title,

body:body,

category:category||"General",

likes_count:0,

replies_count:0,

views_count:0,

is_locked:false,

group_id:groupId

});

if(error){

console.error(error);

showMessage(
"Your group topic could not be created.",
true
);

return;
}

document.getElementById("topicTitle").value="";
document.getElementById("topicCategory").value="";
document.getElementById("topicBody").value="";

await supabaseClient
.from("profiles")
.update({
last_active_at:new Date().toISOString()
})
.eq("id",currentUser.id);

showMessage(
"Group topic created.",
false
);

await loadTopics();
}


/* START */

async function start(){

if(!await checkAuth())return;

groupId=getGroupId();

if(!groupId){

document.getElementById("groupInfo").innerHTML=
`<span class="error">
No group was selected.
</span>`;

return;
}

if(!await loadGroup())return;

await loadMembers();

await loadTopics();
}

start();

</script>

</body>
</html>
