<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeeChat - Search</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#eef7ff;font-family:Arial,sans-serif;font-size:14px;color:#222}
a{color:#0645ad;text-decoration:none}
.header{background:#0066aa;color:#fff;padding:8px;font-size:20px;font-weight:bold}
.nav{background:#ffe680;padding:7px}
.nav a{margin-right:9px}
.box{margin:8px;border:1px solid #aaa;background:#fff}
.title{background:#ffd84d;padding:6px;font-weight:bold}
.content{padding:8px}
input,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid #aaa;margin:4px 0}
button{padding:7px 12px;border:1px solid #888;cursor:pointer;background:#0066aa;color:#fff}
.result{padding:9px 4px;border-bottom:1px solid #ddd}
.result:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:7px}
.role{font-size:11px;background:#eee;border:1px solid #ccc;padding:2px 4px}
.verified{color:#087f23}
.online{color:green;font-size:12px}
.offline{color:#888;font-size:12px}
.small{font-size:12px;color:#777}
.notice{background:#e8f5e9;border:1px solid #9ccc9c;padding:7px;margin-bottom:8px}
.error{background:#ffe5e5;border:1px solid #cc7777;padding:7px;margin-bottom:8px}
.footer{text-align:center;padding:15px;color:#777;font-size:12px}
</style>
</head>

<body>

<div class="header">DeeChat</div>

<div class="nav">
<a href="homepage.html">Home</a>
<a href="members.html">Members</a>
<a href="groups.html">Groups</a>
<a href="topics.html">Topics</a>
<a href="shouts.html">Shouts</a>
<a href="search.html">Search</a>
</div>

<div class="box">
<div class="title">Search DeeChat</div>

<div class="content">

<div class="notice">
Search members, topics, shouts and groups.
</div>

<input id="searchInput" placeholder="Type something to search..." maxlength="100">

<select id="searchType">
<option value="all">Everything</option>
<option value="members">Members</option>
<option value="topics">Topics</option>
<option value="shouts">Shouts</option>
<option value="groups">Groups</option>
</select>

<button onclick="search()">Search</button>

<div id="results" style="margin-top:10px;">
Enter a search term above.
</div>

</div>
</div>

<div class="footer">
©DaVeCrEaToR DeeChat 2026
</div>

<script>
const SUPABASE_URL="https://sqikfejouaxizvidivcg.supabase.co";
const SUPABASE_KEY="sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient=window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function escapeHTML(value){
    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function roleTag(role){
    const tags={
        owner:"[OWNER]",
        super_admin:"[SUPER ADMIN]",
        admin:"[ADMIN]",
        head_mod:"[HEAD MOD]",
        moderator:"[MOD]",
        vip:"[VIP]",
        verified_member:"[VERIFIED]",
        member:"[MEMBER]",
        new_member:"[NEW]"
    };
    return tags[role] || "";
}

function dateText(date){
    if(!date) return "";
    return new Date(date).toLocaleString();
}

async function search(){

    const term=
        document.getElementById("searchInput")
        .value.trim();

    const type=
        document.getElementById("searchType").value;

    const box=document.getElementById("results");

    if(!term){
        box.innerHTML=
            '<div class="error">Enter something to search.</div>';
        return;
    }

    box.innerHTML="Searching...";

    let html="";

    if(type==="all" || type==="members"){
        html+=await searchMembers(term);
    }

    if(type==="all" || type==="topics"){
        html+=await searchTopics(term);
    }

    if(type==="all" || type==="shouts"){
        html+=await searchShouts(term);
    }

    if(type==="all" || type==="groups"){
        html+=await searchGroups(term);
    }

    if(!html){
        html='<div>No results found.</div>';
    }

    box.innerHTML=html;
}

async function searchMembers(term){

    const pattern="%"+term+"%";

    const {data,error}=await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            display_name,
            avatar_url,
            site_role,
            is_verified,
            last_active_at
        `)
        .or(
            "username.ilike."+pattern+
            ",display_name.ilike."+pattern
        )
        .eq("is_banned",false)
        .limit(20);

    if(error || !data || data.length===0){
        return "";
    }

    let html=
        `<div class="title">Members</div>`;

    data.forEach(user=>{

        const online=
            user.last_active_at &&
            Date.now()-new Date(user.last_active_at).getTime()
            < 5*60*1000;

        html+=`
        <div class="result">
            <a href="profile.html?id=${user.id}">
                ${
                    user.avatar_url
                    ? `<img class="avatar"
                        src="${escapeHTML(user.avatar_url)}">`
                    : ""
                }

                <b>${escapeHTML(
                    user.display_name ||
                    user.username
                )}</b>
            </a>

            <span class="role">
                ${escapeHTML(roleTag(user.site_role))}
            </span>

            ${
                user.is_verified
                ? '<span class="verified"> ✓</span>'
                : ""
            }

            <br>

            <span class="${online?"online":"offline"}">
                ${online?"● Online":"○ Offline"}
            </span>
        </div>
        `;
    });

    return html;
}

async function searchTopics(term){

    const pattern="%"+term+"%";

    const {data,error}=await supabaseClient
        .from("topics")
        .select(`
            id,
            title,
            body,
            category,
            likes_count,
            replies_count,
            views_count,
            created_at,
            user_id
        `)
        .or(
            "title.ilike."+pattern+
            ",body.ilike."+pattern+
            ",category.ilike."+pattern
        )
        .order("created_at",{ascending:false})
        .limit(20);

    if(error || !data || data.length===0){
        return "";
    }

    let html=
        `<div class="title">Topics</div>`;

    data.forEach(topic=>{

        html+=`
        <div class="result">
            <a href="topic.html?id=${topic.id}">
                <b>${escapeHTML(topic.title)}</b>
            </a>

            <br>

            <span class="small">
                ${escapeHTML(topic.category || "General")}
                · ${Number(topic.likes_count||0)} likes
                · ${Number(topic.replies_count||0)} replies
                · ${Number(topic.views_count||0)} views
            </span>

            <br>

            ${escapeHTML(
                (topic.body || "").substring(0,160)
            )}

            <br>

            <span class="small">
                ${dateText(topic.created_at)}
            </span>
        </div>
        `;
    });

    return html;
}

async function searchShouts(term){

    const pattern="%"+term+"%";

    const {data,error}=await supabaseClient
        .from("shouts")
        .select(`
            id,
            body,
            likes_count,
            created_at,
            user_id
        `)
        .ilike("body",pattern)
        .order("created_at",{ascending:false})
        .limit(20);

    if(error || !data || data.length===0){
        return "";
    }

    let html=
        `<div class="title">Shouts</div>`;

    data.forEach(shout=>{

        html+=`
        <div class="result">

            ${escapeHTML(shout.body)}

            <br>

            <span class="small">
                ${Number(shout.likes_count||0)} likes
                · ${dateText(shout.created_at)}
            </span>

            <br>

            <a href="profile.html?id=${shout.user_id}">
                View member
            </a>

        </div>
        `;
    });

    return html;
}

async function searchGroups(term){

    const pattern="%"+term+"%";

    const {data,error}=await supabaseClient
        .from("groups")
        .select(`
            id,
            name,
            abbreviation,
            description,
            logo_url,
            created_at
        `)
        .or(
            "name.ilike."+pattern+
            ",abbreviation.ilike."+pattern+
            ",description.ilike."+pattern
        )
        .order("created_at",{ascending:false})
        .limit(20);

    if(error || !data || data.length===0){
        return "";
    }

    let html=
        `<div class="title">Groups</div>`;

    data.forEach(group=>{

        html+=`
        <div class="result">

            <a href="group.html?id=${group.id}">
                ${
                    group.logo_url
                    ? `<img class="avatar"
                        src="${escapeHTML(group.logo_url)}">`
                    : ""
                }

                <b>${escapeHTML(group.name)}</b>
            </a>

            ${
                group.abbreviation
                ? `<span class="role">
                    ${escapeHTML(group.abbreviation)}
                   </span>`
                : ""
            }

            <br>

            ${escapeHTML(
                (group.description || "")
                .substring(0,180)
            )}

            <br>

            <span class="small">
                Created ${dateText(group.created_at)}
            </span>

        </div>
        `;
    });

    return html;
}

document.getElementById("searchInput")
.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
        search();
    }
});
</script>

</body>
</html>
