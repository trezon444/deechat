<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Groups - DeeChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    background:#eaf7ff;
    font-family:Arial,sans-serif;
    font-size:14px;
    color:#222;
}
a{
    color:#0645ad;
    text-decoration:none;
}
.header{
    background:#1683c7;
    color:white;
    padding:10px;
    font-size:20px;
    font-weight:bold;
}
.nav{
    background:#d8efff;
    padding:7px;
    line-height:25px;
    border-bottom:1px solid #9acbe8;
}
.box{
    margin:8px;
    border:1px solid #b5cddd;
    background:white;
}
.title{
    background:#ffd83d;
    padding:7px;
    font-weight:bold;
}
.content{
    padding:8px;
}
.group{
    border-bottom:1px solid #ddd;
    padding:9px 2px;
}
.group:last-child{
    border-bottom:0;
}
.logo{
    width:45px;
    height:45px;
    border-radius:5px;
    background:#ddd;
    object-fit:cover;
    vertical-align:middle;
    margin-right:7px;
}
.group-name{
    font-size:16px;
    font-weight:bold;
}
.abbr{
    font-size:11px;
    color:#777;
}
.description{
    margin-top:5px;
    line-height:1.4;
}
.meta{
    color:#777;
    font-size:11px;
    margin-top:4px;
}
.feature{
    display:inline-block;
    background:#eef8ff;
    border:1px solid #c5deed;
    padding:2px 4px;
    margin:2px;
    font-size:10px;
}
.role{
    display:inline-block;
    padding:1px 4px;
    font-size:10px;
    border:1px solid #ccc;
}
.owner{
    background:#ffd700;
    border-color:#c5a900;
}
.staff{
    background:#cceeff;
    color:#005580;
}
button{
    background:#1683c7;
    color:white;
    border:0;
    padding:7px 12px;
    margin-top:6px;
}
input{
    width:100%;
    box-sizing:border-box;
    padding:8px;
    border:1px solid #aaa;
}
.small{
    color:#777;
    font-size:12px;
}
.error{
    color:#b00000;
    padding:7px;
}
.footer{
    text-align:center;
    padding:15px 8px;
    color:#777;
    font-size:12px;
}
</style>
</head>

<body>

<div class="header">👥 DeeChat Groups</div>

<div class="nav">
<a href="homepage.html">Home</a> |
<a href="shouts.html">Shouts</a> |
<a href="topics.html">Topics</a> |
<a href="members.html">Members</a> |
<a href="groups.html">Groups</a>
</div>

<div class="box">

<div class="title">Groups & Clubs</div>

<div class="content">

<input
id="search"
placeholder="Search groups..."
>

<div id="groupCount" class="small" style="margin-top:6px;">
Loading...
</div>

</div>

</div>


<div class="box">

<div class="title">All Groups</div>

<div class="content" id="groups">
Loading groups...
</div>

</div>


<div class="footer">
© 2026 DeeChat
</div>


<script>

const SUPABASE_URL =
"https://sqikfejouaxizvidivcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser=null;
let groups=[];


/* ESCAPE */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* LOGIN */

async function checkLogin(){

const {data,error} =
await supabaseClient.auth.getSession();

if(error || !data.session){

window.location.href="login.html";

return false;

}

currentUser=data.session.user;

return true;

}


/* ROLE */

function roleTag(role){

if(role==="owner")
return `<span class="role owner">OWNER</span>`;

if(role==="super_admin")
return `<span class="role staff">SUPER ADMIN</span>`;

if(role==="admin")
return `<span class="role staff">ADMIN</span>`;

if(role==="head_mod")
return `<span class="role staff">HEAD MOD</span>`;

if(role==="moderator")
return `<span class="role staff">MOD</span>`;

return "";

}


/* LOAD GROUPS */

async function loadGroups(){

const {data,error} =
await supabaseClient
.from("groups")
.select(`
id,
name,
abbreviation,
logo_url,
description,
rules,
leader_id,
enabled_features,
created_at
`)
.order("created_at",{ascending:false});


if(error){

document.getElementById("groups")
.innerHTML=
`<div class="error">
Could not load groups.
</div>`;

console.error(error);

return;

}

groups=data || [];

renderGroups();

}


/* RENDER */

function renderGroups(){

const search=
document.getElementById("search")
.value
.toLowerCase()
.trim();


let list=
groups.filter(group=>{

if(!search) return true;

return (
(group.name || "")
.toLowerCase()
.includes(search)
||
(group.abbreviation || "")
.toLowerCase()
.includes(search)
||
(group.description || "")
.toLowerCase()
.includes(search)
);

});


document.getElementById("groupCount")
.innerText=
list.length+
(list.length===1?" group":" groups");


const container=
document.getElementById("groups");


if(!list.length){

container.innerHTML=
`<div class="small">
No groups found.
</div>`;

return;

}


container.innerHTML=
list.map(group=>{

const logo=
group.logo_url
?
`<img
class="logo"
src="${escapeHTML(group.logo_url)}"
>`
:
`<span
class="logo"
style="display:inline-block;text-align:center;line-height:45px;"
>👥</span>`;


let features=[];

if(Array.isArray(group.enabled_features)){
features=group.enabled_features;
}
else if(group.enabled_features &&
typeof group.enabled_features==="object"){
features=
Object.keys(group.enabled_features)
.filter(key=>group.enabled_features[key]);
}


const featureHTML=
features
.slice(0,8)
.map(feature=>
`<span class="feature">
${escapeHTML(
feature.replaceAll("_"," ")
)}
</span>`
)
.join("");


return `

<div class="group">

<div>

${logo}

<span style="vertical-align:middle;">

<a
class="group-name"
href="group.html?id=${group.id}"
>
${escapeHTML(group.name)}
</a>

<br>

<span class="abbr">
${escapeHTML(
group.abbreviation || ""
)}
</span>

</span>

</div>

<div class="description">

${escapeHTML(
group.description ||
"No description available."
)}

</div>

<div class="meta">

👑 Leader:
<a href="profile.html?id=${group.leader_id}">
View Leader
</a>

</div>

<div style="margin-top:4px;">

${featureHTML}

</div>

</div>

`;

}).join("");

}


/* SEARCH */

document.getElementById("search")
.addEventListener(
"input",
renderGroups
);


/* START */

(async function(){

const loggedIn=
await checkLogin();

if(!loggedIn) return;

await loadGroups();

})();

</script>

</body>
</html>
