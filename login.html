<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565c0">
  <title>Login - DeeChat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e8f2ff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: #222;
    }

    .site {
      max-width: 650px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      border-left: 1px solid #b7cce2;
      border-right: 1px solid #b7cce2;
    }

    .header {
      background: #1565c0;
      color: white;
      text-align: center;
      padding: 14px 8px;
      border-bottom: 3px solid #0d47a1;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
    }

    .tagline {
      font-size: 12px;
      margin-top: 4px;
    }

    .nav {
      background: #f4d03f;
      border-bottom: 1px solid #c7a900;
      text-align: center;
      padding: 8px;
    }

    .nav a {
      color: #174b8a;
      font-weight: bold;
      text-decoration: none;
      margin: 0 5px;
    }

    .box {
      margin: 10px;
      border: 1px solid #c4d5e5;
      background: #f8fbff;
    }

    .title {
      padding: 8px;
      background: #f1c40f;
      border-bottom: 1px solid #d0a900;
      font-weight: bold;
    }

    .content {
      padding: 12px;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #aebfd0;
      border-radius: 3px;
      background: white;
      font-size: 14px;
    }

    .button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border: 0;
      border-radius: 3px;
      background: #1565c0;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .links {
      text-align: center;
      margin-top: 15px;
      line-height: 2;
    }

    .notice {
      margin-top: 12px;
      padding: 8px;
      background: #fff8d8;
      border: 1px solid #e6d477;
      font-size: 12px;
    }

    .footer {
      margin-top: 18px;
      padding: 13px 8px;
      text-align: center;
      background: #164a7b;
      color: white;
      font-size: 12px;
    }

    .footer a {
      color: white;
    }
  </style>
</head>

<body>

<div class="site">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">💬 DeeChat</div>
    <div class="tagline">Member Login</div>
  </div>

  <!-- NAVIGATION -->
  <div class="nav">
    <a href="index.html">Home</a> |
    <a href="login.html">Login</a> |
    <a href="register.html">Register</a>
  </div>

  <!-- LOGIN BOX -->
  <div class="box">

    <div class="title">
      🔐 Login to DeeChat
    </div>

    <div class="content">

      <form id="loginForm">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        >

        <button class="button" type="submit">
          🔐 Login
        </button>

      </form>

      <div class="links">
        <a href="#">Forgot password?</a>
        <br>
        Don't have an account?
        <a href="register.html">Create one →</a>
      </div>

      <div class="notice">
        🔒 Your account and private information should
        only be accessible after successful login.
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">

    <strong>DeeChat</strong>

    <br><br>

    <a href="#">Rules</a> |
    <a href="#">Privacy</a> |
    <a href="#">Help</a>

    <br><br>

    © 2026 DeeChat

  </div>

</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    alert(
      "Login page is ready. The real authentication system will be connected next."
    );
  });
</script>

</body>
</html>
