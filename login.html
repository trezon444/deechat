<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeeChat - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#eaf4ff;font-family:Arial;font-size:14px}
.header{background:#1976d2;color:white;text-align:center;padding:12px;font-size:21px;font-weight:bold}
.box{margin:10px 8px;background:white;border:1px solid #aaa}
.title{background:#ffe680;padding:8px;font-weight:bold;border-bottom:1px solid #d4b900}
.content{padding:9px}
label{display:block;font-weight:bold;margin-top:8px}
input{width:100%;box-sizing:border-box;padding:9px;margin-top:4px;border:1px solid #aaa}
button{background:#1976d2;color:white;border:0;padding:9px 15px;margin-top:12px}
a{color:#0645ad;text-decoration:none}
.msg{display:none;background:#ffe5e5;color:#a00000;padding:8px;margin-bottom:8px}
</style>
</head>

<body>

<div class="header">💬 DeeChat</div>

<div class="box">
<div class="title">🔐 Login</div>

<div class="content">

<div id="msg" class="msg"></div>

<label>Email</label>
<input id="email" type="email">

<label>Password</label>
<input id="password" type="password">

<button onclick="login()">🔑 Login</button>

<br><br>

<a href="register.html">📝 Create Account</a>

<br><br>

<a href="index.html">🏠 Back to DeeChat</a>

</div>
</div>

<script>
const SUPABASE_URL =
"https://sqikfejouaxizvidivcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function showError(text){
const msg=document.getElementById("msg");
msg.textContent=text;
msg.style.display="block";
}

async function login(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email || !password){
showError("Enter your email and password.");
return;
}

const {data,error}=await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){
showError(error.message);
return;
}

if(data.session){
location.href="homepage.html";
}

}
</script>

</body>
</html>
