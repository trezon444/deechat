<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - DeeChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eaf4ff;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #333;
}

.header {
    background: #1769aa;
    color: white;
    padding: 12px;
    font-size: 20px;
    font-weight: bold;
}

.box {
    margin: 10px;
    border: 1px solid #b7cde2;
    background: white;
}

.title {
    background: #ffe45c;
    padding: 8px;
    font-weight: bold;
}

.content {
    padding: 10px;
}

label {
    display: block;
    margin-top: 9px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 9px;
    margin-top: 4px;
    border: 1px solid #aaa;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: 0;
    background: #1769aa;
    color: white;
    font-weight: bold;
    font-size: 15px;
}

button:disabled {
    background: #888;
}

.message {
    display: none;
    margin-top: 10px;
    padding: 8px;
}

.success {
    background: #d9f7d9;
    border: 1px solid #8ac98a;
}

.error {
    background: #ffdede;
    border: 1px solid #e09090;
}

.links {
    padding: 10px;
    text-align: center;
}

a {
    color: #075aaa;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
    DeeChat
</div>

<div class="box">

    <div class="title">
        Member Login
    </div>

    <div class="content">

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                required
                placeholder="Your email"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                required
                placeholder="Your password"
            >

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>
</div>

<div class="links">
    <a href="#">Forgot password?</a>
</div>

<div class="links">
    Don't have an account?
    <a href="register.html">Register</a>
</div>

<div class="links">
    <a href="index.html">← Back to DeeChat</a>
</div>


<script>

/* ==============================
   DEECHAT SUPABASE
   ============================== */

const SUPABASE_URL =
    "https://sqikfejouaxizvidivcg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==============================
   ELEMENTS
   ============================== */

const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


/* ==============================
   MESSAGE
   ============================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}


/* ==============================
   LOGIN
   ============================== */

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    button.disabled = true;

    button.textContent =
        "Logging in...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    /* LOGIN ERROR */

    if (error) {

        showMessage(
            error.message,
            "error"
        );

        button.disabled = false;

        button.textContent =
            "Login";

        return;
    }


    /* LOGIN SUCCESS */

    if (data.session) {

        showMessage(
            "Login successful! Opening DeeChat...",
            "success"
        );


        setTimeout(function() {

            window.location.href =
                "homepage.html";

        }, 700);

    }

});

</script>

</body>
</html>
