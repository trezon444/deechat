<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeeChat - User Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#eef7ff;font-family:Arial,sans-serif;font-size:14px;color:#222}
a{color:#0645ad;text-decoration:none}
.header{background:#0066aa;color:#fff;padding:8px;font-size:20px;font-weight:bold}
.nav{background:#ffe680;padding:7px}
.nav a{margin-right:9px}
.box{margin:8px;border:1px solid #aaa;background:#fff}
.title{background:#ffd84d;padding:6px;font-weight:bold}
.content{padding:8px}
input,select{width:100%;box-sizing:border-box;padding:8px;margin:4px 0 8px;border:1px solid #aaa}
button{padding:6px 9px;border:1px solid #888;cursor:pointer}
.primary{background:#0066aa;color:#fff}
.good{background:#5cb85c;color:#fff}
.danger{background:#d9534f;color:#fff}
.user{border-bottom:1px solid #ddd;padding:9px 3px}
.user:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:7px}
.tag{font-size:11px;background:#eee;border:1px solid #ccc;padding:2px 4px}
.online{color:green;font-size:12px}
.offline{color:#888;font-size:12px}
.notice{background:#e8f5e9;border:1px solid #9ccc9c;padding:7px;margin-bottom:8px}
.error{background:#ffe5e5;border:1px solid #cc7777;padding:7px;margin-bottom:8px}
.small{font-size:12px;color:#777}
.footer{text-align:center;padding:15px;color:#777;font-size:12px}
</style>
</head>

<body>

<div class="header">DeeChat Admin</div>

<div class="nav">
<a href="admin.html">Dashboard</a>
<a href="admin_users.html">Users</a>
<a href="admin_reports.html">Reports</a>
<a href="admin_rooms.html">Rooms</a>
<a href="admin_groups.html">Groups</a>
<a href="admin_moderators.html">Staff</a>
</div>

<div class="box">
<div class="title">User Management</div>

<div class="content">

<div id="status"></div>

<input id="search" placeholder="Search username or display name...">

<select id="roleFilter">
<option value="all">All Roles</option>
<option value="owner">Owner</option>
<option value="super_admin">Super Admin</option>
<option value="admin">Admin</option>
<option value="head_mod">Head Mod</option>
<option value="moderator">Moderator</option>
<option value="vip">VIP</option>
<option value="verified_member">Verified Member</option>
<option value="member">Member</option>
<option value="new_member">New Member</option>
</select>

<button class="primary" onclick="loadUsers()">Search Users</button>

<div id="users" style="margin-top:10px">
Loading users...
</div>

</div>
</div>

<div class="footer">
©DaVeCrEaToR DeeChat 2026
</div>

<script>
const SUPABASE_URL="https://sqikfejouaxizvidivcg.supabase.co";
const SUPABASE_KEY="sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient=window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const staffRoles=[
    "owner",
    "super_admin",
    "admin",
    "head_mod",
    "moderator"
];

const roleNames={
    owner:"OWNER",
    super_admin:"SUPER ADMIN",
    admin:"ADMIN",
    head_mod:"HEAD MOD",
    moderator:"MODERATOR",
    vip:"VIP",
    verified_member:"VERIFIED",
    member:"MEMBER",
    new_member:"NEW MEMBER"
};

let currentUser=null;
let currentProfile=null;

function escapeHTML(value){
    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showStatus(message,error=false){
    document.getElementById("status").innerHTML=
        `<div class="${error?"error":"notice"}">
            ${escapeHTML(message)}
        </div>`;
}

async function init(){

    const {data:{session}}=
        await supabaseClient.auth.getSession();

    if(!session){
        location.href="login.html";
        return;
    }

    currentUser=session.user;

    const {data:profile,error}=await supabaseClient
        .from("profiles")
        .select("id,username,site_role")
        .eq("id",currentUser.id)
        .single();

    if(error || !profile || !staffRoles.includes(profile.site_role)){
        document.getElementById("status").innerHTML=
            '<div class="error">Access denied. Staff only.</div>';
        document.getElementById("users").innerHTML="";
        return;
    }

    currentProfile=profile;

    await loadUsers();
}

async function loadUsers(){

    const box=document.getElementById("users");
    const term=
        document.getElementById("search").value.trim();

    const role=
        document.getElementById("roleFilter").value;

    box.innerHTML="Loading...";

    let query=supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            display_name,
            avatar_url,
            site_role,
            points,
            is_verified,
            is_banned,
            is_suspended,
            last_active_at,
            created_at
        `)
        .order("created_at",{ascending:false})
        .limit(100);

    if(role!=="all"){
        query=query.eq("site_role",role);
    }

    if(term){
        const pattern="%"+term+"%";

        query=query.or(
            "username.ilike."+pattern+
            ",display_name.ilike."+pattern
        );
    }

    const {data,error}=await query;

    if(error){
        box.innerHTML=
            '<div class="error">Could not load users.</div>';
        return;
    }

    if(!data || data.length===0){
        box.innerHTML="<div>No users found.</div>";
        return;
    }

    box.innerHTML=data.map(user=>{

        const online=
            user.last_active_at &&
            Date.now()-
            new Date(user.last_active_at).getTime()
            <5*60*1000;

        return `
        <div class="user">

            ${
                user.avatar_url
                ? `<img class="avatar"
                    src="${escapeHTML(user.avatar_url)}">`
                : ""
            }

            <a href="profile.html?id=${user.id}">
                <b>
                    ${escapeHTML(
                        user.display_name ||
                        user.username
                    )}
                </b>
            </a>

            <span class="tag">
                ${escapeHTML(
                    roleNames[user.site_role] ||
                    user.site_role
                )}
            </span>

            ${
                user.is_verified
                ? '<span title="Verified">✓</span>'
                : ""
            }

            <br>

            <span class="${online?"online":"offline"}">
                ${online?"● Online":"○ Offline"}
            </span>

            ${
                user.is_banned
                ? '<span class="tag">BANNED</span>'
                : ""
            }

            ${
                user.is_suspended
                ? '<span class="tag">SUSPENDED</span>'
                : ""
            }

            <br>

            <span class="small">
                @${escapeHTML(user.username)}
                · Points: ${Number(user.points||0)}
                · Joined: ${formatDate(user.created_at)}
            </span>

            <br><br>

            <button onclick="verifyUser('${user.id}',${!user.is_verified})">
                ${user.is_verified?"Unverify":"Verify"}
            </button>

            <button onclick="suspendUser('${user.id}',${!user.is_suspended})">
                ${user.is_suspended?"Unsuspend":"Suspend"}
            </button>

            <button onclick="banUser('${user.id}',${!user.is_banned})"
                class="${user.is_banned?"good":"danger"}">
                ${user.is_banned?"Unban":"Ban"}
            </button>

            <button onclick="changeRole('${user.id}','${user.site_role}')">
                Change Role
            </button>

            <button onclick="deleteUser('${user.id}')"
                class="danger">
                Delete
            </button>

        </div>
        `;
    }).join("");
}

async function verifyUser(id,value){

    if(id===currentUser.id){
        alert("You cannot change your own verification here.");
        return;
    }

    const {error}=await supabaseClient
        .from("profiles")
        .update({is_verified:value})
        .eq("id",id);

    if(error){
        showStatus("Verification update failed: "+error.message,true);
        return;
    }

    loadUsers();
}

async function suspendUser(id,value){

    if(id===currentUser.id){
        alert("You cannot suspend yourself.");
        return;
    }

    const {error}=await supabaseClient
        .from("profiles")
        .update({is_suspended:value})
        .eq("id",id);

    if(error){
        showStatus("Suspension update failed: "+error.message,true);
        return;
    }

    loadUsers();
}

async function banUser(id,value){

    if(id===currentUser.id){
        alert("You cannot ban yourself.");
        return;
    }

    const {error}=await supabaseClient
        .from("profiles")
        .update({is_banned:value})
        .eq("id",id);

    if(error){
        showStatus("Ban update failed: "+error.message,true);
        return;
    }

    loadUsers();
}

async function changeRole(id,currentRole){

    if(id===currentUser.id){
        alert("Do not change your own role here.");
        return;
    }

    const roles=[
        "new_member",
        "member",
        "verified_member",
        "vip",
        "moderator",
        "head_mod",
        "admin",
        "super_admin"
    ];

    const answer=prompt(
        "Enter new role:\n\n"+
        roles.join("\n"),
        currentRole
    );

    if(!answer || !roles.includes(answer)){
        return;
    }

    const {error}=await supabaseClient
        .from("profiles")
        .update({site_role:answer})
        .eq("id",id);

    if(error){
        showStatus("Role update failed: "+error.message,true);
        return;
    }

    loadUsers();
}

async function deleteUser(id){

    if(id===currentUser.id){
        alert("You cannot delete your own account here.");
        return;
    }

    const confirmed=confirm(
        "Delete this profile?\n\n"+
        "This removes the profile record. "+
        "The authentication account should be deleted "+
        "through a secure server-side Owner function."
    );

    if(!confirmed) return;

    const {error}=await supabaseClient
        .from("profiles")
        .delete()
        .eq("id",id);

    if(error){
        showStatus("Could not delete profile: "+error.message,true);
        return;
    }

    showStatus("Profile record deleted.");
    loadUsers();
}

function formatDate(date){
    if(!date) return "Unknown";
    return new Date(date).toLocaleString();
}

init();
</script>

</body>
</html>
