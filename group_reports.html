<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeeChat - Group Reports</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#eef7ff;font-family:Arial,sans-serif;font-size:14px;color:#222}
a{color:#0645ad;text-decoration:none}
.header{background:#0066aa;color:#fff;padding:8px;font-size:20px;font-weight:bold}
.nav{background:#ffe680;padding:7px;border-bottom:1px solid #ccc}
.nav a{margin-right:9px}
.box{margin:8px;border:1px solid #aaa;background:#fff}
.title{background:#ffd84d;padding:6px;font-weight:bold}
.content{padding:8px}
input,select,textarea{width:100%;box-sizing:border-box;padding:7px;margin:4px 0 8px;border:1px solid #aaa}
textarea{min-height:70px}
button{padding:6px 10px;border:1px solid #888;cursor:pointer}
.primary{background:#0066aa;color:#fff}
.danger{background:#d9534f;color:#fff}
.good{background:#5cb85c;color:#fff}
.report{border-bottom:1px solid #ddd;padding:9px 3px}
.report:last-child{border-bottom:0}
.small{font-size:12px;color:#777}
.badge{display:inline-block;padding:2px 5px;background:#eee;border:1px solid #ccc;font-size:11px}
.pending{background:#fff0b3}
.reviewing{background:#d9edf7}
.resolved{background:#dff0d8}
.dismissed{background:#eee}
.notice{background:#e8f5e9;border:1px solid #9ccc9c;padding:7px;margin-bottom:8px}
.error{background:#ffe5e5;border:1px solid #cc7777;padding:7px;margin-bottom:8px}
.footer{text-align:center;padding:15px;color:#777;font-size:12px}
</style>
</head>

<body>

<div class="header">DeeChat</div>

<div class="nav">
<a href="homepage.html">Home</a>
<a href="groups.html">Groups</a>
<a href="group.html?id=" id="groupLink">Group</a>
<a href="group_panel.html?id=" id="panelLink">Panel</a>
<a href="profile.html">Profile</a>
</div>

<div class="box">
<div class="title">Group Reports</div>

<div class="content">

<div id="status"></div>
<div id="groupInfo"></div>

<div id="reportForm" style="display:none;">
<b>Report Something</b>

<select id="targetType">
<option value="user">User</option>
<option value="message">Message</option>
<option value="shout">Shout</option>
<option value="topic">Topic</option>
<option value="group">Group</option>
</select>

<input id="targetId" placeholder="Target ID">

<textarea id="reason" placeholder="Explain the problem..."></textarea>

<button class="primary" onclick="submitReport()">Submit Report</button>
</div>

<hr>

<b>Reports</b>

<div style="margin:7px 0;">
<select id="filter" onchange="loadReports()">
<option value="all">All Reports</option>
<option value="pending">Pending</option>
<option value="reviewing">Reviewing</option>
<option value="resolved">Resolved</option>
<option value="dismissed">Dismissed</option>
</select>
</div>

<div id="reports">Loading reports...</div>

</div>
</div>

<div class="footer">
©DaVeCrEaToR DeeChat 2026
</div>

<script>
const SUPABASE_URL = "https://sqikfejouaxizvidivcg.supabase.co";
const SUPABASE_KEY = "sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";
const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params = new URLSearchParams(location.search);
const groupId = params.get("id") || params.get("group_id");

let currentUser = null;
let currentProfile = null;
let currentGroup = null;

function escapeHTML(value){
    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function roleTag(role){
    const tags={
        owner:"[OWNER]",
        super_admin:"[SUPER ADMIN]",
        admin:"[ADMIN]",
        head_mod:"[HEAD MOD]",
        moderator:"[MOD]",
        vip:"[VIP]",
        verified_member:"[VERIFIED]",
        member:"[MEMBER]",
        new_member:"[NEW]"
    };
    return tags[role] || "";
}

function isStaff(){
    return ["owner","super_admin","admin","head_mod","moderator"]
        .includes(currentProfile?.site_role);
}

function isGroupManager(){
    if(isStaff()) return true;

    if(!currentGroup || !currentUser) return false;

    if(currentGroup.leader_id === currentUser.id) return true;

    return currentGroup.co_leaders?.includes(currentUser.id);
}

async function init(){

    const {data:{session}} = await supabaseClient.auth.getSession();

    if(!session){
        location.href="login.html";
        return;
    }

    currentUser=session.user;

    if(!groupId){
        document.getElementById("status").innerHTML=
            '<div class="error">No group selected.</div>';
        return;
    }

    document.getElementById("groupLink").href="group.html?id="+groupId;
    document.getElementById("panelLink").href="group_panel.html?id="+groupId;

    await loadProfile();
    await loadGroup();
    await loadReports();

    if(isGroupManager()){
        document.getElementById("reportForm").style.display="block";
    }
}

async function loadProfile(){

    const {data,error}=await supabaseClient
        .from("profiles")
        .select("id,username,site_role")
        .eq("id",currentUser.id)
        .single();

    if(!error) currentProfile=data;
}

async function loadGroup(){

    const {data,error}=await supabaseClient
        .from("groups")
        .select("*")
        .eq("id",groupId)
        .single();

    if(error){
        document.getElementById("groupInfo").innerHTML=
            '<div class="error">Group could not be loaded.</div>';
        return;
    }

    currentGroup=data;

    let managerText=isGroupManager()
        ? "You can manage group reports."
        : "You can submit reports.";

    document.getElementById("groupInfo").innerHTML=`
        <div class="notice">
            <b>${escapeHTML(data.name)}</b>
            ${data.abbreviation ? " ["+escapeHTML(data.abbreviation)+"]" : ""}
            <br>
            <span class="small">${managerText}</span>
        </div>
    `;
}

async function submitReport(){

    const targetType=document.getElementById("targetType").value;
    const targetId=document.getElementById("targetId").value.trim();
    const reason=document.getElementById("reason").value.trim();

    if(!targetId || !reason){
        alert("Enter the target ID and reason.");
        return;
    }

    const {error}=await supabaseClient
        .from("reports")
        .insert({
            reporter_id:currentUser.id,
            target_type:targetType,
            target_id:targetId,
            reason:reason,
            status:"pending"
        });

    if(error){
        alert("Could not submit report.");
        return;
    }

    document.getElementById("targetId").value="";
    document.getElementById("reason").value="";

    alert("Report submitted.");
    loadReports();
}

async function loadReports(){

    const box=document.getElementById("reports");
    const filter=document.getElementById("filter").value;

    let query=supabaseClient
        .from("reports")
        .select(`
            id,
            reporter_id,
            target_user_id,
            target_type,
            target_id,
            reason,
            status,
            action_taken,
            reviewed_by,
            created_at,
            resolved_at
        `)
        .order("created_at",{ascending:false})
        .limit(100);

    if(filter !== "all"){
        query=query.eq("status",filter);
    }

    const {data,error}=await query;

    if(error){
        box.innerHTML=
            '<div class="error">Reports could not be loaded.</div>';
        return;
    }

    if(!data || data.length===0){
        box.innerHTML="<div>No reports found.</div>";
        return;
    }

    box.innerHTML=data.map(r=>{

        const statusClass=r.status || "pending";

        return `
        <div class="report">

            <b>${escapeHTML(r.target_type || "Report")}</b>
            <span class="badge ${statusClass}">
                ${escapeHTML(r.status || "pending")}
            </span>

            <br>

            <span class="small">
                Target: ${escapeHTML(r.target_id || "N/A")}
            </span>

            <br><br>

            ${escapeHTML(r.reason || "")}

            <br><br>

            <span class="small">
                Reported: ${formatDate(r.created_at)}
            </span>

            ${
                r.action_taken
                ? `<br><span class="small">
                    Action: ${escapeHTML(r.action_taken)}
                   </span>`
                : ""
            }

            ${
                isGroupManager()
                ? `
                <br><br>

                ${
                    r.status==="pending"
                    ? `<button class="primary"
                        onclick="updateReport('${r.id}','reviewing')">
                        Review
                       </button>`
                    : ""
                }

                ${
                    r.status!=="resolved"
                    ? `<button class="good"
                        onclick="updateReport('${r.id}','resolved')">
                        Resolve
                       </button>`
                    : ""
                }

                ${
                    r.status!=="dismissed"
                    ? `<button
                        onclick="updateReport('${r.id}','dismissed')">
                        Dismiss
                       </button>`
                    : ""
                }
                `
                : ""
            }

        </div>
        `;

    }).join("");
}

async function updateReport(id,status){

    if(!isGroupManager()){
        alert("You do not have permission.");
        return;
    }

    let action="";

    if(status==="resolved"){
        action=prompt("Enter action taken:","Reviewed by group management") || "";
    }

    const {error}=await supabaseClient
        .from("reports")
        .update({
            status:status,
            action_taken:action,
            reviewed_by:currentUser.id,
            resolved_at:status==="resolved" || status==="dismissed"
                ? new Date().toISOString()
                : null
        })
        .eq("id",id);

    if(error){
        alert("Could not update report.");
        return;
    }

    loadReports();
}

function formatDate(date){
    if(!date) return "";
    return new Date(date).toLocaleString();
}

init();
</script>

</body>
</html>
