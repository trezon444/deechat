<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeeChat - Shouts</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    background: #eaf4ff;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #333;
}

.header {
    background: #1769aa;
    color: white;
    padding: 10px;
    font-size: 21px;
    font-weight: bold;
}

.nav {
    background: white;
    border-bottom: 1px solid #b7cde2;
    padding: 7px;
}

.nav a {
    color: #075aaa;
    text-decoration: none;
    margin-right: 8px;
}

.box {
    margin: 8px;
    background: white;
    border: 1px solid #b7cde2;
}

.title {
    background: #ffe45c;
    padding: 7px;
    font-weight: bold;
}

.content {
    padding: 8px;
}

textarea {
    width: 100%;
    height: 65px;
    box-sizing: border-box;
    padding: 7px;
    border: 1px solid #aaa;
    resize: vertical;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

button {
    margin-top: 6px;
    background: #1769aa;
    color: white;
    border: 0;
    padding: 7px 12px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #888;
}

#postMessage {
    margin-top: 7px;
}

.success {
    color: #087a18;
}

.error {
    color: #b00000;
}

.shout {
    border-bottom: 1px solid #eee;
    padding: 8px 0;
}

.shout:last-child {
    border-bottom: 0;
}

.username {
    color: #075aaa;
    font-weight: bold;
}

.role {
    color: #555;
    font-size: 11px;
    font-weight: normal;
}

.date {
    color: #888;
    font-size: 11px;
    margin-top: 3px;
}

.like {
    color: #075aaa;
    margin-top: 4px;
}

.empty,
.loading {
    color: #777;
}
</style>
</head>

<body>

<div class="header">
    DeeChat
</div>

<div class="nav">
    <a href="homepage.html">Home</a>
    <a href="shouts.html">Shouts</a>
    <a href="topics.html">Topics</a>
    <a href="chat.html">Chat</a>
    <a href="members.html">Members</a>
    <a href="groups.html">Groups</a>
</div>

<div class="box">

    <div class="title">
        Create Shout
    </div>

    <div class="content">

        <textarea
            id="shoutText"
            maxlength="500"
            placeholder="What's on your mind?"
        ></textarea>

        <button id="postShout">
            Post Shout
        </button>

        <div id="postMessage"></div>

    </div>
</div>

<div class="box">

    <div class="title">
        Latest Shouts
    </div>

    <div class="content" id="shouts">
        <div class="loading">
            Loading shouts...
        </div>
    </div>

</div>

<script>

/* ===============================
   SUPABASE
================================ */

const SUPABASE_URL =
    "https://sqikfejouaxizvidivcg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let currentUser = null;


/* ===============================
   ESCAPE HTML
================================ */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null ? "" : String(value);

    return div.innerHTML;
}


/* ===============================
   MESSAGE
================================ */

function showMessage(message, type) {

    const box =
        document.getElementById("postMessage");

    box.className =
        type || "";

    box.textContent =
        message;
}


/* ===============================
   LOGIN CHECK
================================ */

async function checkLogin() {

    const result =
        await supabaseClient.auth.getSession();

    if (result.error) {

        console.error(
            "Session error:",
            result.error
        );

        showMessage(
            "Unable to check your login.",
            "error"
        );

        return false;
    }

    const session =
        result.data.session;

    if (!session || !session.user) {

        window.location.href =
            "login.html";

        return false;
    }

    currentUser =
        session.user;

    return true;
}


/* ===============================
   LOAD SHOUTS
================================ */

async function loadShouts() {

    const container =
        document.getElementById("shouts");

    container.innerHTML =
        '<div class="loading">Loading shouts...</div>';


    const result =
        await supabaseClient
            .from("shouts")
            .select(`
                id,
                body,
                likes_count,
                created_at,
                user_id,
                profiles (
                    username,
                    display_name,
                    site_role,
                    is_verified
                )
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(50);


    if (result.error) {

        console.error(
            "Load shouts error:",
            result.error
        );

        container.innerHTML =
            '<div class="error">' +
            'Unable to load shouts.<br><br>' +
            escapeHTML(
                result.error.message
            ) +
            '</div>';

        return;
    }


    const shouts =
        result.data || [];


    if (shouts.length === 0) {

        container.innerHTML =
            '<div class="empty">' +
            'No shouts yet. Be the first to post!' +
            '</div>';

        return;
    }


    container.innerHTML = "";


    shouts.forEach(function(shout) {

        const profile =
            shout.profiles || {};


        let roleText = "";


        if (profile.site_role === "owner") {

            roleText = "👑 OWNER";

        } else if (
            profile.site_role &&
            profile.site_role !== "member" &&
            profile.site_role !== "new_member"
        ) {

            roleText =
                profile.site_role
                    .replace(/_/g, " ")
                    .toUpperCase();
        }


        const name =
            profile.display_name ||
            profile.username ||
            "Member";


        const shoutDiv =
            document.createElement("div");

        shoutDiv.className =
            "shout";


        shoutDiv.innerHTML = `

            <div class="username">
                ${escapeHTML(name)}

                ${
                    profile.is_verified
                    ? " ✅"
                    : ""
                }

                ${
                    roleText
                    ? `
                        <span class="role">
                            [${escapeHTML(roleText)}]
                        </span>
                      `
                    : ""
                }
            </div>

            <div>
                ${escapeHTML(shout.body)}
            </div>

            <div class="date">
                ${formatDate(shout.created_at)}
            </div>

            <div class="like">
                ❤️ ${Number(shout.likes_count) || 0} likes
            </div>

        `;

        container.appendChild(shoutDiv);

    });
}


/* ===============================
   DATE
================================ */

function formatDate(value) {

    if (!value) return "";

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString();
}


/* ===============================
   POST SHOUT
================================ */

async function postShout() {

    const button =
        document.getElementById(
            "postShout"
        );

    const textarea =
        document.getElementById(
            "shoutText"
        );

    const body =
        textarea.value.trim();


    if (!body) {

        showMessage(
            "Write something first.",
            "error"
        );

        textarea.focus();

        return;
    }


    if (body.length > 500) {

        showMessage(
            "Maximum 500 characters.",
            "error"
        );

        return;
    }


    /* Refresh session */

    const sessionResult =
        await supabaseClient.auth.getSession();


    if (
        sessionResult.error ||
        !sessionResult.data.session
    ) {

        window.location.href =
            "login.html";

        return;
    }


    currentUser =
        sessionResult.data.session.user;


    button.disabled = true;

    button.textContent =
        "Posting...";

    showMessage("", "");


    try {

        const result =
            await supabaseClient
                .from("shouts")
                .insert({
                    user_id: currentUser.id,
                    body: body
                })
                .select()
                .single();


        if (result.error) {

            console.error(
                "POST SHOUT ERROR:",
                result.error
            );

            showMessage(
                "Could not post shout: " +
                result.error.message,
                "error"
            );

            return;
        }


        console.log(
            "SHOUT CREATED:",
            result.data
        );


        textarea.value = "";


        showMessage(
            "Shout posted successfully! ✅",
            "success"
        );


        await loadShouts();

    } catch (error) {

        console.error(
            "Unexpected error:",
            error
        );

        showMessage(
            "Something went wrong: " +
            error.message,
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "Post Shout";
    }
}


/* ===============================
   POST BUTTON
================================ */

document
    .getElementById("postShout")
    .addEventListener(
        "click",
        postShout
    );


/* ===============================
   CTRL + ENTER
================================ */

document
    .getElementById("shoutText")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                event.ctrlKey
            ) {

                event.preventDefault();

                postShout();
            }
        }
    );


/* ===============================
   AUTH LISTENER
================================ */

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        if (session && session.user) {

            currentUser =
                session.user;

        } else {

            currentUser = null;
        }
    }
);


/* ===============================
   START
================================ */

(async function() {

    const loggedIn =
        await checkLogin();

    if (!loggedIn) {
        return;
    }

    await loadShouts();

})();

</script>

</body>
</html>
