<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeeChat - Shouts</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    background:#eaf4ff;
    font-family:Arial,sans-serif;
    font-size:13px;
    color:#333;
}

.header{
    background:#1769aa;
    color:white;
    padding:10px;
    font-size:21px;
    font-weight:bold;
}

.nav{
    background:white;
    border-bottom:1px solid #b7cde2;
    padding:7px;
}

.nav a{
    color:#075aaa;
    text-decoration:none;
    margin-right:8px;
}

.box{
    margin:8px;
    background:white;
    border:1px solid #b7cde2;
}

.title{
    background:#ffe45c;
    padding:7px;
    font-weight:bold;
}

.content{
    padding:8px;
}

textarea{
    width:100%;
    height:65px;
    box-sizing:border-box;
    padding:7px;
    border:1px solid #aaa;
    resize:vertical;
    font-family:Arial,sans-serif;
    font-size:13px;
}

button{
    margin-top:6px;
    background:#1769aa;
    color:white;
    border:0;
    padding:7px 12px;
    font-weight:bold;
}

button:disabled{
    background:#888;
}

.shout{
    border-bottom:1px solid #eee;
    padding:8px 0;
}

.shout:last-child{
    border-bottom:0;
}

.username{
    color:#075aaa;
    font-weight:bold;
}

.role{
    color:#555;
    font-size:11px;
}

.date{
    color:#888;
    font-size:11px;
    margin-top:3px;
}

.like{
    color:#075aaa;
    margin-top:4px;
}

.error{
    color:#b00000;
}

.success{
    color:#087a18;
}

.empty{
    color:#777;
}
</style>
</head>

<body>

<div class="header">
    DeeChat
</div>

<div class="nav">
    <a href="homepage.html">Home</a>
    <a href="shouts.html">Shouts</a>
    <a href="topics.html">Topics</a>
    <a href="chat.html">Chat</a>
    <a href="members.html">Members</a>
    <a href="groups.html">Groups</a>
</div>

<div class="box">
    <div class="title">
        Create Shout
    </div>

    <div class="content">

        <textarea
            id="shoutText"
            maxlength="500"
            placeholder="What's on your mind?"
        ></textarea>

        <button id="postButton">
            Post Shout
        </button>

        <div id="postMessage"></div>

    </div>
</div>


<div class="box">

    <div class="title">
        Latest Shouts
    </div>

    <div class="content" id="shouts">
        Loading shouts...
    </div>

</div>


<script>

const SUPABASE_URL =
"https://sqikfejouaxizvidivcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;


/* ESCAPE HTML */

function escapeHTML(text){

    const div =
    document.createElement("div");

    div.textContent =
    text || "";

    return div.innerHTML;
}


/* DATE */

function formatDate(date){

    if(!date) return "";

    const d =
    new Date(date);

    if(isNaN(d.getTime()))
        return "";

    return d.toLocaleString();
}


/* LOGIN */

async function checkLogin(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();

    if(error){

        console.error(error);

        return false;
    }

    if(!data.session){

        window.location.href =
        "login.html";

        return false;
    }

    currentUser =
    data.session.user;

    return true;
}


/* LOAD SHOUTS */

async function loadShouts(){

    const container =
    document.getElementById("shouts");

    container.innerHTML =
    "Loading shouts...";


    /*
       IMPORTANT:
       We DO NOT request profiles(...)
       because there is no Supabase
       relationship between shouts and profiles.
    */

    const {
        data: shouts,
        error
    } =
    await supabaseClient
    .from("shouts")
    .select(
        "id, body, likes_count, created_at, user_id"
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    )
    .limit(50);


    if(error){

        console.error(
            "SHOUT LOAD ERROR:",
            error
        );

        container.innerHTML =
        '<div class="error">' +
        'Unable to load shouts.<br><br>' +
        escapeHTML(error.message) +
        '</div>';

        return;
    }


    if(!shouts || shouts.length === 0){

        container.innerHTML =
        '<div class="empty">' +
        'No shouts yet. Be the first to post!' +
        '</div>';

        return;
    }


    /* GET USER IDS */

    const userIds =
    [
        ...new Set(
            shouts.map(
                shout => shout.user_id
            )
        )
    ];


    /* LOAD PROFILES SEPARATELY */

    let profiles = [];


    if(userIds.length > 0){

        const profileResult =
        await supabaseClient
        .from("profiles")
        .select(
            "id, username, display_name, site_role, is_verified"
        )
        .in(
            "id",
            userIds
        );


        if(profileResult.error){

            console.error(
                "PROFILE LOAD ERROR:",
                profileResult.error
            );

        }else{

            profiles =
            profileResult.data || [];
        }
    }


    /* CREATE PROFILE LOOKUP */

    const profileMap = {};

    profiles.forEach(
        profile => {

            profileMap[
                profile.id
            ] = profile;

        }
    );


    container.innerHTML = "";


    /* DISPLAY SHOUTS */

    shouts.forEach(
        shout => {

            const profile =
            profileMap[
                shout.user_id
            ] || {};


            const name =
            profile.display_name ||
            profile.username ||
            "Member";


            let role = "";


            if(profile.site_role === "owner"){

                role = "👑 OWNER";

            }else if(
                profile.site_role &&
                profile.site_role !== "member" &&
                profile.site_role !== "new_member"
            ){

                role =
                profile.site_role
                .replace(/_/g," ")
                .toUpperCase();
            }


            const shoutDiv =
            document.createElement("div");

            shoutDiv.className =
            "shout";


            shoutDiv.innerHTML = `

                <div class="username">

                    ${escapeHTML(name)}

                    ${
                        profile.is_verified
                        ? " ✅"
                        : ""
                    }

                    ${
                        role
                        ? `
                        <span class="role">
                            [${escapeHTML(role)}]
                        </span>
                        `
                        : ""
                    }

                </div>

                <div>
                    ${escapeHTML(shout.body)}
                </div>

                <div class="date">
                    ${formatDate(shout.created_at)}
                </div>

                <div class="like">
                    ❤️ ${Number(shout.likes_count) || 0} likes
                </div>

            `;


            container.appendChild(
                shoutDiv
            );

        }
    );
}


/* POST SHOUT */

async function postShout(){

    const textarea =
    document.getElementById(
        "shoutText"
    );

    const button =
    document.getElementById(
        "postButton"
    );

    const message =
    document.getElementById(
        "postMessage"
    );


    const body =
    textarea.value.trim();


    if(!body){

        message.className =
        "error";

        message.textContent =
        "Write something first.";

        return;
    }


    /* CHECK SESSION AGAIN */

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(error || !data.session){

        window.location.href =
        "login.html";

        return;
    }


    currentUser =
    data.session.user;


    button.disabled = true;

    button.textContent =
    "Posting...";

    message.textContent = "";


    try{

        const result =
        await supabaseClient
        .from("shouts")
        .insert({

            user_id:
            currentUser.id,

            body:
            body

        })
        .select()
        .single();


        if(result.error){

            console.error(
                "POST SHOUT ERROR:",
                result.error
            );

            message.className =
            "error";

            message.textContent =
            "Could not post shout: " +
            result.error.message;

            return;
        }


        textarea.value = "";


        message.className =
        "success";

        message.textContent =
        "Shout posted successfully! ✅";


        await loadShouts();


    }catch(error){

        console.error(error);

        message.className =
        "error";

        message.textContent =
        "Something went wrong: " +
        error.message;

    }finally{

        button.disabled = false;

        button.textContent =
        "Post Shout";
    }
}


/* BUTTON */

document
.getElementById("postButton")
.addEventListener(
    "click",
    postShout
);


/* CTRL + ENTER */

document
.getElementById("shoutText")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            event.ctrlKey
        ){

            event.preventDefault();

            postShout();
        }

    }
);


/* START */

(async function(){

    const loggedIn =
    await checkLogin();

    if(!loggedIn)
        return;

    await loadShouts();

})();

</script>

</body>
</html>
