<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1565c0">

  <title>Register - DeeChat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e8f2ff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      color: #222;
    }

    .site {
      max-width: 650px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      border-left: 1px solid #b7cce2;
      border-right: 1px solid #b7cce2;
    }

    .header {
      background: #1565c0;
      color: white;
      text-align: center;
      padding: 14px 8px;
      border-bottom: 3px solid #0d47a1;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
    }

    .tagline {
      font-size: 12px;
      margin-top: 4px;
    }

    .nav {
      background: #f4d03f;
      border-bottom: 1px solid #c7a900;
      text-align: center;
      padding: 8px;
    }

    .nav a {
      color: #174b8a;
      font-weight: bold;
      text-decoration: none;
      margin: 0 5px;
    }

    .box {
      margin: 10px;
      border: 1px solid #c4d5e5;
      background: #f8fbff;
    }

    .title {
      padding: 8px;
      background: #f1c40f;
      border-bottom: 1px solid #d0a900;
      font-weight: bold;
    }

    .content {
      padding: 12px;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 9px;
      border: 1px solid #aebfd0;
      border-radius: 3px;
      background: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    .button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      border: 0;
      border-radius: 3px;
      background: #16843b;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .note {
      margin-top: 10px;
      padding: 8px;
      background: #fff8d8;
      border: 1px solid #e6d477;
      font-size: 12px;
    }

    .footer {
      margin-top: 18px;
      padding: 13px 8px;
      text-align: center;
      background: #164a7b;
      color: white;
      font-size: 12px;
    }

    .footer a {
      color: white;
    }
  </style>
</head>

<body>

<div class="site">

  <div class="header">
    <div class="logo">💬 DeeChat</div>
    <div class="tagline">
      Create your account
    </div>
  </div>

  <div class="nav">
    <a href="index.html">Home</a> |
    <a href="login.html">Login</a> |
    <a href="register.html">Register</a>
  </div>

  <div class="box">

    <div class="title">
      📝 Create DeeChat Account
    </div>

    <div class="content">

      <form id="registerForm">

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          maxlength="30"
          placeholder="Choose a username"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          placeholder="Create a password"
          required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          minlength="8"
          placeholder="Enter password again"
          required
        >

        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">Select</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
          <option value="prefer_not_to_say">
            Prefer not to say
          </option>
        </select>

        <label for="bio">Short Bio</label>
        <textarea
          id="bio"
          name="bio"
          maxlength="250"
          placeholder="Tell us a little about yourself"
        ></textarea>

        <button class="button" type="submit">
          📝 Create Account
        </button>

      </form>

      <div class="note">
        By registering, you agree to follow the DeeChat
        community rules.
      </div>

      <p style="text-align:center;">
        Already have an account?
        <a href="login.html">Login here →</a>
      </p>

    </div>

  </div>

  <div class="footer">
    <strong>DeeChat</strong>
    <br><br>

    <a href="#">Rules</a> |
    <a href="#">Privacy</a> |
    <a href="#">Help</a>

    <br><br>

    © 2026 DeeChat
  </div>

</div>

<script>
  document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      alert("Passwords do not match.");
      return;
    }

    alert(
      "Registration form is ready. The real account system will be connected when we add the backend."
    );
  });
</script>

</body>
</html>
