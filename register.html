<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - DeeChat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eaf4ff;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #333;
}

.header {
    background: #1769aa;
    color: white;
    padding: 12px;
    font-size: 20px;
    font-weight: bold;
}

.box {
    margin: 10px;
    border: 1px solid #b7cde2;
    background: white;
}

.title {
    background: #ffe45c;
    padding: 8px;
    font-weight: bold;
}

.content {
    padding: 10px;
}

label {
    display: block;
    margin-top: 9px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 9px;
    margin-top: 4px;
    border: 1px solid #aaa;
    font-size: 14px;
}

textarea {
    height: 75px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: 0;
    background: #1769aa;
    color: white;
    font-weight: bold;
    font-size: 15px;
}

button:disabled {
    background: #888;
}

.message {
    display: none;
    margin-top: 10px;
    padding: 8px;
}

.success {
    background: #d9f7d9;
    border: 1px solid #8ac98a;
}

.error {
    background: #ffdede;
    border: 1px solid #e09090;
}

.links {
    padding: 10px;
    text-align: center;
}

a {
    color: #075aaa;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
    DeeChat
</div>

<div class="box">

    <div class="title">
        Create Your DeeChat Account
    </div>

    <div class="content">

        <form id="registerForm">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                maxlength="20"
                required
                placeholder="Choose a username"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                required
                placeholder="you@example.com"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                minlength="6"
                required
                placeholder="At least 6 characters"
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                minlength="6"
                required
                placeholder="Enter password again"
            >

            <label for="gender">Gender</label>
            <select id="gender">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
                <option value="Prefer not to say">
                    Prefer not to say
                </option>
            </select>

            <label for="bio">Bio</label>
            <textarea
                id="bio"
                maxlength="500"
                placeholder="Tell members something about you..."
            ></textarea>

            <button type="submit" id="registerButton">
                Create Account
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>
</div>

<div class="links">
    Already have an account?
    <a href="login.html">Login</a>
</div>

<div class="links">
    <a href="index.html">← Back to DeeChat</a>
</div>


<script>

/* ==============================
   DEECHAT SUPABASE CONNECTION
   ============================== */

const SUPABASE_URL =
    "https://sqikfejouaxizvidivcg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==============================
   FORM ELEMENTS
   ============================== */

const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");


/* ==============================
   MESSAGE FUNCTION
   ============================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}


/* ==============================
   REGISTRATION
   ============================== */

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username")
        .value
        .trim();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;

    const gender =
        document.getElementById("gender")
        .value;

    const bio =
        document.getElementById("bio")
        .value
        .trim();


    /* USERNAME CHECK */

    if (username.length < 3) {

        showMessage(
            "Username must be at least 3 characters.",
            "error"
        );

        return;
    }


    if (!/^[a-zA-Z0-9_]+$/.test(username)) {

        showMessage(
            "Username can only contain letters, numbers and underscores.",
            "error"
        );

        return;
    }


    /* PASSWORD CHECK */

    if (password.length < 6) {

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    /* DISABLE BUTTON */

    button.disabled = true;

    button.textContent =
        "Creating account...";


    /* ==============================
       SUPABASE SIGN UP
       ============================== */

    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    username: username,

                    display_name: username,

                    gender: gender,

                    bio: bio

                }

            }

        });


    /* ==============================
       ERROR
       ============================== */

    if (error) {

        showMessage(
            error.message,
            "error"
        );

        button.disabled = false;

        button.textContent =
            "Create Account";

        return;
    }


    /* ==============================
       SUCCESS
       ============================== */

    if (data.user) {

        if (data.session) {

            showMessage(
                "Account created successfully! Opening DeeChat...",
                "success"
            );

            setTimeout(function() {

                window.location.href =
                    "homepage.html";

            }, 1200);

        } else {

            showMessage(
                "Account created! Check your email and confirm your account before logging in.",
                "success"
            );

            button.disabled = false;

            button.textContent =
                "Create Account";
        }

    }

});

</script>

</body>
</html>
