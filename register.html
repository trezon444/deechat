<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeeChat - Register</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#eaf4ff;font-family:Arial;font-size:14px}
.header{background:#1976d2;color:white;text-align:center;padding:12px;font-size:21px;font-weight:bold}
.box{margin:10px 8px;background:white;border:1px solid #aaa}
.title{background:#ffe680;padding:8px;font-weight:bold;border-bottom:1px solid #d4b900}
.content{padding:9px}
label{display:block;font-weight:bold;margin-top:8px}
input,textarea{width:100%;box-sizing:border-box;padding:8px;margin-top:4px;border:1px solid #aaa}
textarea{height:80px}
button{background:#1976d2;color:white;border:0;padding:9px 14px;margin-top:12px}
a{color:#0645ad;text-decoration:none}
.msg{display:none;padding:8px;margin-bottom:8px}
.error{background:#ffe5e5;color:#a00000}
</style>
</head>

<body>

<div class="header">💬 DeeChat</div>

<div class="box">
<div class="title">📝 Create Account</div>

<div class="content">

<div id="msg" class="msg error"></div>

<label>Username</label>
<input id="username" maxlength="30" required>

<label>Email</label>
<input id="email" type="email" required>

<label>Password</label>
<input id="password" type="password" required>

<label>Confirm Password</label>
<input id="confirmPassword" type="password" required>

<label>Gender</label>
<select id="gender" style="width:100%;padding:8px;margin-top:4px">
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Bio</label>
<textarea id="bio" maxlength="500"></textarea>

<button onclick="register()">🚀 Register</button>

<br><br>

Already have an account?
<a href="login.html">Login</a>

</div>
</div>

<script>
const SUPABASE_URL =
"https://sqikfejouaxizvidivcg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_FKnNj1zvRFkgUY8i2nHZCg_AjIT1hlQ";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function showError(text){
const msg=document.getElementById("msg");
msg.textContent=text;
msg.style.display="block";
}

async function register(){

const username=document.getElementById("username").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const confirm=document.getElementById("confirmPassword").value;
const gender=document.getElementById("gender").value;
const bio=document.getElementById("bio").value.trim();

if(!username || !email || !password){
showError("Please fill all required fields.");
return;
}

if(password !== confirm){
showError("Passwords do not match.");
return;
}

if(password.length < 6){
showError("Password must be at least 6 characters.");
return;
}

const {data,error}=await supabaseClient.auth.signUp({
email:email,
password:password,
options:{
data:{
username:username,
display_name:username,
gender:gender,
bio:bio
}
}
});

if(error){
showError(error.message);
return;
}

/*
With email confirmation OFF,
Supabase should return an active session.
*/

if(data.session){
location.href="homepage.html";
}else{
showError("Account created. Please log in.");
location.href="login.html";
}

}
</script>

</body>
</html>
